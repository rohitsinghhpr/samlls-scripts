<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="https://cdn-icons-png.flaticon.com/32/3177/3177440.png">
    <title>Facebook Profiles</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #f3f4f6;
            padding: 30px;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        #profiles {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .card {
            display: block;
            text-decoration: none;
            color: #222;
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 12px rgba(0, 0, 0, .12);
            transition: all .25s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 24px rgba(0, 0, 0, .18);
        }

        .card img {
            width: 100%;
            aspect-ratio: 1/1;
            object-fit: cover;
            display: block;
            background: #e5e7eb;
        }

        .info {
            padding: 15px;
        }

        .name {
            text-align: center;
            font-size: 18px;
            font-weight: 600;
            line-height: 1.4;
            word-break: break-word;
        }
    </style>
</head>

<body>

    <h1>Facebook Profiles</h1>
    <div id="profiles"></div>

    <script>
        const container = document.getElementById("profiles");

        fetch("./fb_extracted_profiles_data/profile2.json")
            .then(response => {
                if (!response.ok) {
                    throw new Error("Failed to load profiles.json");
                }
                return response.json();
            })
            .then(profiles => {
                profiles.forEach(profile => {
                    const card = document.createElement("a");
                    card.className = "card";
                    card.href = profile["profile-url"];
                    card.target = "_blank";
                    card.rel = "noopener noreferrer";

                    card.innerHTML = `
                <img
                    src="${profile["profile-img"]}"
                    alt="${profile["user-name"]}"
                    loading="lazy"
                    onerror="this.src='https://via.placeholder.com/400?text=No+Image'"
                >
                <div class="info">
                    <div class="name">${profile["user-name"]}</div>
                </div>
            `;

                    container.appendChild(card);
                });
            })
            .catch(error => {
                console.error(error);
                container.innerHTML = "<p>Failed to load profiles.</p>";
            });
    </script>
</body>

</html>
